item_under_test: >
  Fictional web app. Two companies on one login page. Testers use the browser.
  Isolation: Company A must not see Company B case titles in search.
objectives:
  - Isolation on search and case list
  - Role buttons match docs/roles.md
  - Login success and failure
  - Empty title does not create a case
  - Denied actions appear in Activity log
